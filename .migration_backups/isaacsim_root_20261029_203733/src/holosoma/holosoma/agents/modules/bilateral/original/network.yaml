# Original v6 observation routing; separate A/B module banks for inference.
# Context modulation uses MAGNet's existing use_sym_param path, once.
keys:
  obs0: 'obsn'
  mem0: 'memo'
  obs1: 'obsn'
  end0: 'end0'
  state: 'state' # NOTE(ycho): should technically also include z_ctx
  # state: [['net','z_ctx'], ['net', 'z_state']] # NOTE(ycho): should technically also include z_ctx
  # state: 'net/(z_ctx|z_state)' # NOTE(ycho): should technically also include z_ctx
  mem1: 'memo'
  act_dist: 'act_dist'
  value: 'value'
  actn: 'actn'
  logp: 'logp'
  mu: 'mu'

nets:
  ## "BACKBONE" BLOCK ##
  left_cat:
    class_type: domi.net.td.common:Cat
    ki: 'obsn'
    ko: 'net/left_cat'
    delim: '/'

    params:
      # concat all 'left' except hscan
      keys: 'left/left/(?!height_scan|point_cloud|env_code|voxel_grid|noise|base_pose_2d|noisy_last_action|teacher_action|teacher_logstd).*'
      delim: '/'

  right_cat:
    class_type: domi.net.td.common:Cat
    ki: 'obsn'
    ko: 'net/right_cat'
    delim: '/'
    params:
      # concat all 'right' except hscan
      keys: 'right/right/(?!height_scan|point_cloud|env_code|voxel_gri|noise|base_pose_2d|noisy_last_action|teacher_action|teacher_logstd).*'
      delim: '/'

  context:
    class_type: domi.net.td.common:Cat
    ki: 'obsn'
    ko: 'net/context'
    delim: '/'
    params:
      keys: 'left/left/.*_cmd|left/left/height_scan|left/left/projected_gravity|left/left/joint_pos|right/right/.*_cmd|right/right/height_scan|right/right/projected_gravity|right/right/joint_pos'
      delim: '/'
      rank:
        left/left/height_scan: 2
        right/right/height_scan: 2

  merge_state:
    class_type: domi.net.td.common:DictArg
    ki: [['net','left_cat'], ['net','right_cat'], ['net','context']]
    ko: [['state']]
    params:
      # NOTE(ycho): these names are actually "hardcoded"
      # w.r.t the current XFM implementation...!
      keys: ['l', 'r', 'c'] # state.c // state.s
  #########################

  init_mem:
    class_type: domi.net.td:InitMemMA
    ki: ['obsn']
    ko: ['memo']
    params:
      agent:
        left: 'left'
        right: 'right'


  magnet:
    class_type: domi.net.td.bilateral_magnet:BilateralMAGNetMA
    # TODO(ycho): consider support for A.B for brevity?
    ki: ['memo', 'state', 'state']
    ko: ['act_dist', 'value']
    params:
      router: # ONLY _ONE_ ROUTER FOR NOW
        ctx: 'c' # net/C/c
      subnet:
        left:
          obs: 'l'
          act: '(?!right).*'
          rew: null
          dim: [192,384,192]
        left_critic:
          obs: 'l'
          act: null
          rew: '(?!right).*'
          dim: [192,384,192]
        right:
          obs: 'r'
          act: '(?!left).*'
          rew: null
          dim: [192,384,192]
        right_critic:
          obs: 'r'
          act: null
          rew: '(?!left).*'
          dim: [192,384,192]

      ortho_init: true
      # gate: false
      gate_sizes: 8
      num_module: 4
      share_ab_modules: false  # Tie A/B expert weights, retaining separate routes.
      use_sym_param: true
      # penultimate_only: true
      use_default_module: true
      compose_mode: feature
      preact: false  # Feature composition enables preactivation, as in v6.
      mod_gate: softmax
      weight_recenter: true
      weight_recenter_momentum: 0.01

      sub_alias:
        right: 'left'
        right_critic: 'left_critic'

  logp_mu:
    class_type: domi.net.td:LogpMuMA # i.e. works for most distributions
    ki: ['act_dist', 'actn']
    ko: ['logp', 'mu']
